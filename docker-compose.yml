name: mvbar

services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Europe/London

      # internal (single-container) connection strings
      DATABASE_URL: postgresql://mvbar:mvbar@127.0.0.1:5432/mvbar
      REDIS_URL: redis://127.0.0.1:6379
      MEILI_HOST: http://127.0.0.1:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

      # app config
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      COOKIE_NAME: ${COOKIE_NAME:-mvbar_token}
      APP_DOMAIN: ${APP_DOMAIN:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-20480}
      BACKUP_DIR: /data/backups
      PLUGINS_ENABLED: ${PLUGINS_ENABLED:-true}
      PLUGINS_DIR: /data/plugins
      PLUGIN_MAX_UPLOAD_MB: ${PLUGIN_MAX_UPLOAD_MB:-50}
      PLUGIN_TIMEOUT_MS: ${PLUGIN_TIMEOUT_MS:-15000}
      PLUGIN_MEMORY_MB: ${PLUGIN_MEMORY_MB:-64}
      PLUGIN_MAX_CONCURRENCY: ${PLUGIN_MAX_CONCURRENCY:-4}

      # worker
      MUSIC_DIRS: /music
      AUDIOBOOK_DIRS: /audiobooks
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-32}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-25}
      METADATA_TIMEOUT_MS: ${METADATA_TIMEOUT_MS:-300000}
      TEMPO_DETECT: ${TEMPO_DETECT:-0}
      TEMPO_MODE: ${TEMPO_MODE:-batch}
      TEMPO_METHOD: ${TEMPO_METHOD:-energy}
      TEMPO_MIN_CONF: ${TEMPO_MIN_CONF:-0.35}
      TEMPO_CONCURRENCY: ${TEMPO_CONCURRENCY:-2}
      TEMPO_BACKFILL_INTERVAL_MS: ${TEMPO_BACKFILL_INTERVAL_MS:-1800000}
      TEMPO_BACKFILL_BATCH: ${TEMPO_BACKFILL_BATCH:-50}

      # web -> api internal calls
      API_INTERNAL_BASE: http://127.0.0.1:3001

    volumes:
      # mount your music (edit these)
      - /path/to/music:/music:ro
      #- /path/to/music2:/music2:ro

      # mount your audiobooks
      #- /path/to/audiobooks:/audiobooks:ro

      # persistent data
      - pg:/var/lib/postgresql/data
      - redis:/data/redis
      - meili:/meili_data
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
      - cache:/data/cache
      - backups:/data/backups
      - plugins:/data/plugins
      - device_logs:/data/device-logs
      - hls:/hls
      - podcasts:/podcasts
      - audiobooks:/audiobooks

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  pg:
  redis:
  meili:
  caddy_data:
  caddy_config:
  cache:
  backups:
  plugins:
  device_logs:
  hls:
  podcasts:
  audiobooks:
