name: One-time verify equalizer indicator

on:
  push:
    branches: [fix/equalizer-indicator]
    paths:
      - '.github/workflows/one-time-verify-equalizer-indicator.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/equalizer-indicator
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint and build web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Remove verification workflow
        run: |
          git rm .github/workflows/one-time-verify-equalizer-indicator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove equalizer verification workflow"
          git push origin HEAD:fix/equalizer-indicator
