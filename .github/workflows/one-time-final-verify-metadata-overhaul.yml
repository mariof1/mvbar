name: One-time final verify metadata overhaul

on:
  push:
    branches: [fix/metadata-editor-overhaul]
    paths:
      - '.github/workflows/one-time-final-verify-metadata-overhaul.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/metadata-editor-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            worker/package-lock.json
            web/package-lock.json
      - name: Prepare metadata test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m venv /tmp/mvbar-meta
          /tmp/mvbar-meta/bin/pip install --quiet mutagen==1.47.0
          /tmp/mvbar-meta/bin/python -m py_compile api/scripts/edit_audio_metadata.py
      - name: Test API
        working-directory: api
        run: |
          npm ci
          npm run lint
          npm test
      - name: Test worker with metadata round trips
        working-directory: worker
        env:
          MVBAR_METADATA_TEST_PYTHON: /tmp/mvbar-meta/bin/python
        run: |
          npm ci
          npm run lint
          npm test
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Build standalone API image
        run: docker build -f api/Dockerfile -t mvbar-api-metadata-test api
      - name: Build Deezer/Mutagen layer
        run: docker build --target deezer_builder -t mvbar-deezer-metadata-test .
      - name: Remove verification workflow
        run: |
          git rm .github/workflows/one-time-final-verify-metadata-overhaul.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove final metadata verification workflow"
          git push origin HEAD:fix/metadata-editor-overhaul
