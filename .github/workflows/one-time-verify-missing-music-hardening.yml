name: One-time verify Missing Music hardening batch

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-verify-missing-music-hardening.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            worker/package-lock.json
            web/package-lock.json
      - name: Test API
        working-directory: api
        run: |
          npm ci
          npm run lint
          npm test
      - name: Build worker
        working-directory: worker
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Remove verification workflow
        run: |
          git rm .github/workflows/one-time-verify-missing-music-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Missing Music hardening verification workflow"
          git push origin HEAD:dev