name: One-time verify Deezer downloader resilience
# rerun after duplicate-tail cleanup

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-verify-deezer-downloader-resilience.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Test API
        working-directory: api
        run: |
          npm ci
          npm run lint
          npm test
      - name: Check Deezer Python bridge syntax
        run: python3 -m py_compile api/scripts/deezer_download.py
      - name: Build Deezer Python image layer
        run: docker build --target deezer_builder -t mvbar-deezer-builder-check .
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Remove verification workflow
        run: |
          git rm .github/workflows/one-time-verify-deezer-downloader-resilience.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Deezer downloader resilience verification workflow"
          git push origin HEAD:dev