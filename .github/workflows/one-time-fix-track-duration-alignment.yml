name: One-time track duration alignment fix

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-fix-track-duration-alignment.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Patch album track row alignment
        shell: python
        run: |
          from pathlib import Path

          path = Path('web/app/BrowseNew.tsx')
          text = path.read_text()

          start_marker = '  // Album Detail View\n  if (albumDetail) {'
          end_marker = '        {editOpen && editTrack && ('
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          section = text[start:end]

          old_duration = '<div className="text-xs sm:text-sm text-slate-500 flex-shrink-0">{formatDuration(track.duration_ms)}</div>'
          new_duration = '<div className="w-12 sm:w-14 text-right tabular-nums text-xs sm:text-sm text-slate-500 flex-shrink-0">{formatDuration(track.duration_ms)}</div>'
          if section.count(old_duration) != 1:
              raise SystemExit(f'expected 1 album duration column, found {section.count(old_duration)}')
          section = section.replace(old_duration, new_duration, 1)

          old_actions = '<div className="flex items-center gap-0 sm:gap-1 sm:opacity-0 sm:group-hover:opacity-100">'
          new_actions = '<div className="flex w-[5.75rem] sm:w-[7.25rem] flex-shrink-0 items-center justify-end gap-0 sm:gap-1 sm:opacity-0 sm:group-hover:opacity-100">'
          if section.count(old_actions) != 1:
              raise SystemExit(f'expected 1 album action group, found {section.count(old_actions)}')
          section = section.replace(old_actions, new_actions, 1)

          text = text[:start] + section + text[end:]
          path.write_text(text)

      - name: Verify alignment guards
        shell: python
        run: |
          from pathlib import Path
          text = Path('web/app/BrowseNew.tsx').read_text()
          assert 'w-12 sm:w-14 text-right tabular-nums' in text
          assert 'w-[5.75rem] sm:w-[7.25rem] flex-shrink-0 items-center justify-end' in text

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit tested fix
        shell: bash
        run: |
          git rm .github/workflows/one-time-fix-track-duration-alignment.yml
          git add web/app/BrowseNew.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep album track durations aligned"
          git push origin HEAD:dev
